name: DRC Files
on:
  push:
    paths:
      - '**.kicad_sch'
      - '**.kicad_pcb'

  pull_request:
    paths:
      - '**.kicad_sch'
      - '**.kicad_pcb'
      
  workflow_dispatch:

jobs:
  drc-files:
    name: DRC ${{ matrix.variant }}
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad9_auto:1.9.0

    strategy:
      fail-fast: false
      matrix:
        variant: [V1, V2, "V2 Lite", "V3 Pro"]

    steps:

    - name: Generate Short SHA Environment Variable
      run: echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV

    - name: Update system repositories, Install Required Libraries and Initialize git-lfs
      run: |
        apt update
        apt -y install git git-lfs zip librsvg2-bin imagemagick
        git lfs install
    - name: Checkout Repository
      uses: actions/checkout@v2
      with:
        lfs: true

    - name: DRC SB_Pixel_Count Files (${{ matrix.variant }})
      run: |
        cd "${{ matrix.variant }}/PCB"
        rm -rf SB_Pixel_Count/
        kibot -c ../../.github/workflows/scripts/kibot/drc.config.kibot.yaml -e SB_Pixel_Count.kicad_sch -b SB_Pixel_Count.kicad_pcb -d SB_Pixel_Count

    - name: Upload Export Files as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: output-${{ matrix.variant }}
        path: |
          ${{ matrix.variant }}/PCB/SB_Pixel_Count/**
        if-no-files-found: error
        retention-days: 60

    # Runs even if DRC above found violations, so a PCB image and
    # schematic PDF are always available to review in CI.
    - name: Render Schematic PDF + PCB Image (${{ matrix.variant }})
      if: always()
      run: |
        cd "${{ matrix.variant }}/PCB"
        rm -rf SB_Pixel_Count_Render/
        kibot -c ../../.github/workflows/scripts/kibot/render.config.kibot.yaml -e SB_Pixel_Count.kicad_sch -b SB_Pixel_Count.kicad_pcb -d SB_Pixel_Count_Render

    - name: Upload Render Files as Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: render-${{ matrix.variant }}
        path: |
          ${{ matrix.variant }}/PCB/SB_Pixel_Count_Render/**
        if-no-files-found: error
        retention-days: 60
